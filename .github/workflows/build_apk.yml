name: 🚀 Build Milla Automix APK

on:
  push:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 📦 Assemble NormalDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Dar permisos de ejecución a Gradlew
        run: chmod +x ./gradlew

      - name: 🛠️ Ensamblar APK (NormalDebug)
        run: ./gradlew assembleNormalDebug --no-configuration-cache --stacktrace

      - name: 📤 Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: milla-automix-debug-apk
          path: app/build/outputs/apk/normal/debug/*.apk
          retention-days: 14
