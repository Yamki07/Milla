$kind: http-request
name: 'Get OAuth2 Token (Client Credentials)'
method: POST
url: 'https://auth.tidal.com/v1/oauth2/token'
order: 1000
auth:
  type: basic
  credentials:
    - key: username
      value: '{{tidal_client_id}}'
    - key: password
      value: '{{tidal_client_secret}}'
body:
  type: urlencoded
  content:
    - key: client_id
      value: '{{tidal_client_id}}'
    - key: client_secret
      value: '{{tidal_client_secret}}'
    - key: grant_type
      value: client_credentials
description: 'Get an OAuth2 access token using client credentials. Used by the Monochrome web frontend for bot-preview rendering.'
