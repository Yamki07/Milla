$kind: http-request
name: 'Get Artist Metadata'
method: GET
url: 'https://api.tidal.com/v1/artists/{{artist_id}}'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tidal_access_token}}'
queryParams:
  - key: countryCode
    value: US
description: 'Get metadata for a specific artist by ID. Returns name and picture ID.'
