$kind: http-request
name: 'Get Track Stream URL (Proxy)'
method: GET
url: '{{base_url}}/stream'
order: 2000
queryParams:
  - key: id
    value: '{{track_id}}'
  - key: quality
    value: HI_RES_LOSSLESS
description: '[PRIMARY] Get a direct stream URL for a track via the Monochrome Proxy. Use this as the primary fallback when a full manifest is not needed. Quality options: HI_RES_LOSSLESS, LOSSLESS, HIGH, LOW.'
