<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milla Player + Millay (Vista Previa en Vivo)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0A0B10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #FF007A;
            --accent-cyan: #00E5FF;
            --text-primary: #FFFFFF;
            --text-secondary: #9092A6;
            --nav-bg: #12131C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: #030305;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Phone Device Mockup Frame */
        .device-container {
            width: 410px;
            height: 840px;
            background: var(--bg-dark);
            border-radius: 44px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 12px #1A1B26;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Android Status Bar */
        .status-bar {
            height: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 13px;
            font-weight: 600;
            color: #A0A2B6;
            z-index: 100;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(8px);
        }

        /* Top Milla Header Bar */
        .milla-app-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--card-border);
            z-index: 90;
        }

        .milla-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .milla-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-color), #7928CA);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 0, 122, 0.4);
        }

        .milla-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #FFF, #A0A2B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .automix-pill {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: var(--accent-cyan);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* App Views Container */
        .app-view {
            flex: 1;
            overflow: hidden;
            display: none;
            position: relative;
        }

        .app-view.active {
            display: flex;
            flex-direction: column;
        }

        /* 🎵 1. MILLA PLAYER VIEW (Local & RetroMusic) */
        .milla-player-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .now-playing-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .vinyl-cover {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 6px solid #1A1B26;
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(0,0,0,0.6);
            animation: spinVinyl 12s linear infinite;
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-title {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-top: 16px;
            text-align: center;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
            text-align: center;
        }

        .player-controls-panel {
            width: 100%;
            margin-top: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
            margin: 12px 0;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-cyan));
            border-radius: 2px;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .buttons-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            font-size: 20px;
        }

        .play-btn-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #7928CA);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFF;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(255, 0, 122, 0.4);
            cursor: pointer;
        }

        /* ⚡ 2. MILLAY WEB VIEW (Monochrome HiFi Tidal Frame) */
        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Persistent Mini Player at Bottom */
        .mini-player-bar {
            height: 60px;
            background: rgba(18, 19, 28, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 95;
        }

        .mini-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-thumb {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
        }

        .mini-text h4 {
            font-size: 13px;
            font-weight: 700;
        }

        .mini-text p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 18px;
        }

        /* 📱 Bottom Navigation Bar (RetroMusic 5 Tabs) */
        .bottom-nav {
            height: 64px;
            background: var(--nav-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s ease;
        }

        .nav-tab i {
            font-size: 18px;
        }

        .nav-tab.active {
            color: var(--accent-color);
        }

        .nav-tab.millay-tab {
            color: var(--accent-cyan);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="device-container">
        <!-- Android Status Bar -->
        <div class="status-bar">
            <span>20:00</span>
            <div style="display:flex; gap:8px;">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Milla Top Header -->
        <div class="milla-app-header">
            <div class="milla-brand">
                <div class="milla-logo-icon">🎵</div>
                <div class="milla-title">Milla</div>
            </div>
            <div class="automix-pill">
                <i class="fa-solid fa-sliders"></i> Automix DJ
            </div>
        </div>

        <!-- VIEW 1: MILLA NATIVE REPRODUCTOR (RetroMusic) -->
        <div id="view-player" class="app-view active">
            <div class="milla-player-content">
                <div class="now-playing-card">
                    <img class="vinyl-cover" id="current-vinyl" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60" alt="Album Cover">
                    <div class="song-title" id="player-title">Blinding Lights</div>
                    <div class="song-artist" id="player-artist">The Weeknd • After Hours</div>

                    <div class="player-controls-panel">
                        <div class="progress-bar-container">
                            <div class="progress-fill"></div>
                        </div>
                        <div class="time-labels">
                            <span>1:24</span>
                            <span>3:20</span>
                        </div>

                        <div class="buttons-row">
                            <i class="fa-solid fa-shuffle" style="color:var(--text-secondary)"></i>
                            <i class="fa-solid fa-backward-step"></i>
                            <div class="play-btn-main" onclick="togglePlay()"><i class="fa-solid fa-pause" id="main-play-icon"></i></div>
                            <i class="fa-solid fa-forward-step"></i>
                            <i class="fa-solid fa-repeat" style="color:var(--text-secondary)"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: MILLAY TAB (Monochrome Web App Frame) -->
        <div id="view-millay" class="app-view">
            <iframe class="iframe-container" src="index.html"></iframe>
        </div>

        <!-- Persistent Mini Player Bar -->
        <div class="mini-player-bar">
            <div class="mini-info">
                <img id="mini-thumb" class="mini-thumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60">
                <div class="mini-text">
                    <h4 id="mini-title">Blinding Lights</h4>
                    <p id="mini-artist">The Weeknd</p>
                </div>
            </div>
            <div class="mini-controls">
                <i class="fa-solid fa-backward-step" style="color:var(--text-secondary)"></i>
                <i class="fa-solid fa-pause" id="mini-play-icon" onclick="togglePlay()"></i>
                <i class="fa-solid fa-forward-step" style="color:var(--text-secondary)"></i>
            </div>
        </div>

        <!-- Bottom Navigation Bar (5 Tabs) -->
        <div class="bottom-nav">
            <div class="nav-tab active" id="tab-songs" onclick="switchNav('player', 'tab-songs')">
                <i class="fa-solid fa-music"></i>
                <span>Canciones</span>
            </div>
            <div class="nav-tab" id="tab-albums" onclick="switchNav('player', 'tab-albums')">
                <i class="fa-solid fa-compact-disc"></i>
                <span>Álbumes</span>
            </div>
            <div class="nav-tab" id="tab-artists" onclick="switchNav('player', 'tab-artists')">
                <i class="fa-solid fa-user-large"></i>
                <span>Artistas</span>
            </div>
            <div class="nav-tab" id="tab-playlists" onclick="switchNav('player', 'tab-playlists')">
                <i class="fa-solid fa-list-ul"></i>
                <span>Playlists</span>
            </div>
            <div class="nav-tab millay-tab" id="tab-millay" onclick="switchNav('millay', 'tab-millay')">
                <i class="fa-solid fa-bolt"></i>
                <span>MILLAY</span>
            </div>
        </div>
    </div>

    <script>
        function switchNav(viewId, tabId) {
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

            document.getElementById('view-' + viewId).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        let isPlaying = true;
        function togglePlay() {
            isPlaying = !isPlaying;
            const mainIcon = document.getElementById('main-play-icon');
            const miniIcon = document.getElementById('mini-play-icon');
            const vinyl = document.getElementById('current-vinyl');

            if (isPlaying) {
                mainIcon.className = 'fa-solid fa-pause';
                miniIcon.className = 'fa-solid fa-pause';
                vinyl.style.animationPlayState = 'running';
            } else {
                mainIcon.className = 'fa-solid fa-play';
                miniIcon.className = 'fa-solid fa-play';
                vinyl.style.animationPlayState = 'paused';
            }
        }
    </script>
</body>
</html>
